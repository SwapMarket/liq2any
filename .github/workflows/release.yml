# Builds the maker for Debian when a version tag is pushed, and the taker page reproducibly, and publishes them as a pre-release
# with checksums.
# It builds in Debian 12, because a binary needs a glibc no newer than the machine it runs on. Actions are pinned to exact commits.
# x86-64, and arm64 for a Raspberry Pi 4 or 5 with a 64-bit OS, each built natively on its own kind of runner.
name: Release the maker

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: rust:1.99.1-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p liq2any-maker -p liq2any-signer
      - name: Check the binaries start on this architecture
        run: |
          for b in liq2any-maker liq2any-signer; do
            out=$(target/release/$b /nonexistent/config.json 2>&1 || true)
            echo "$b: $out"
            echo "$out" | grep -q "stopped:"
          done
      - name: Package
        run: |
          name="liq2any-maker-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          test "$(uname -m)" = "${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/liq2any-signer target/release/liq2any-maker deploy/* LICENSE "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          rm -r "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # The page at this tag, built reproducibly (client/reproducible), so the signed SHA256SUMS covers it too, and anyone can run it
  # on their own machine if the site is ever gone: see OFFLINE.md inside it.
  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The deploy keeps the toolchain image; without it, this builds it, which takes about 20 minutes.
      - name: Reuse the toolchain image
        id: image
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/page-builder.tar
          key: page-builder-${{ hashFiles('client/reproducible/Dockerfile', 'client/reproducible/build-inside.sh', 'client/wasm/Cargo.lock') }}
      - name: Load it
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/page-builder.tar
      - name: Build the page, as anyone can
        run: |
          name="liq2any-page-${GITHUB_REF_NAME}"
          scripts/build-page.sh "$GITHUB_SHA" "dist/$name"
          cp client/reproducible/OFFLINE.md client/LICENSE "dist/$name/"
          cd dist
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "$name" | gzip -n > "$name.tar.gz"
          rm -r "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-page
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, page]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --title "$GITHUB_REF_NAME" \
            --notes "The liq2any maker, for Debian 12 or later: x86_64, and aarch64 for a Raspberry Pi 4 or 5 with a 64-bit OS. For the test networks, Liquid testnet and Polygon Amoy, until the mainnet escrow is deployed. Installation is in README.md inside the archive. liq2any-page-${GITHUB_REF_NAME}.tar.gz is the taker page at this tag, built reproducibly, to run on your own machine if the site is ever gone (OFFLINE.md inside). SHA256SUMS.asc, SwapMarket's signature, is added by hand after this."
