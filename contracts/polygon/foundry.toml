[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Polygon's Bor accepts PUSH0, MCOPY and TSTORE but not BLOBBASEFEE (checked on mainnet and Amoy, 2026-11-22). Shanghai uses none
# of the Cancun opcodes, so nothing depends on that check.
evm_version = "shanghai"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
