[package]
name = "liq2any-maker-core"
version = "0.1.0"
edition = "2021"
description = "liq2any maker: pure swap state machine, signer policy and crash-safe store"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
liq2any-swapkey = { path = "../../contracts/swapkey" }

[dev-dependencies]
proptest = "1"
