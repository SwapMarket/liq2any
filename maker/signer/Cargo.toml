[package]
name = "liq2any-signer"
version = "0.1.0"
edition = "2021"
description = "liq2any maker signer: a separate process that holds the keys and enforces its own policy"
license = "MIT"
publish = false

[dependencies]
liq2any-chain = { path = "../../shared/chain" }
liq2any-swapkey = { path = "../../contracts/swapkey" }
liq2any-maker-core = { path = "../core" }
simplicityhl = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
