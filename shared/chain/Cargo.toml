# Used by the maker's signer and daemon. Liquid from liq2sol (docs/copied.md); Polygon written here.
[package]
name = "liq2any-chain"
version = "0.1.0"
edition = "2021"
description = "Liquid and Polygon plumbing shared by the liq2any maker"
license = "MIT"
publish = false

[features]
default = ["native"]
# Blocking chain access. The browser client builds without it.
native = ["liq2any-swapkey/secp256k1", "dep:ureq", "dep:serde_json"]

[dependencies]
liq2any-swapkey = { path = "../../contracts/swapkey", default-features = false }
rand = "0.8"
simplicityhl = "=0.9.0"
getrandom = "0.2"
# libsecp256k1, the version musig2 already brings, for recoverable ECDSA signatures on Polygon.
secp256k1 = { version = "=0.29.1", features = ["recovery"] }
sha3 = "=0.12.0"
ureq = { version = "2", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
liq2any-swapkey = { path = "../../contracts/swapkey" }
